# Travel insurance eval, DRAFT. Drafted by Claude on 2026-10-01 from the indexed documents.
# status: unreviewed. These are not ground truth and no accuracy number is reported.
# `npm run eval` checks only that every quote is found on its cited page.
# Evidence: [source id from sources.json, page, exact quote]. Verdicts: covered | needs_extension | excluded | unclear.
# No answers yet for Bituach Yashir, Menora and WeSure: their documents are not indexed.
status: unreviewed
drafted_on: 2026-10-01
items:
  - id: ski-piste
    question: Skiing or snowboarding on a marked piste, during opening hours
    answers:
      PassportCard:
        verdict: needs_extension
        why: Winter sports are excluded unless the chapter 14 winter-sports extension is bought (23.23).
        evidence:
          - [passportcard-policy, 61, "סקי שלג ו/או סנובורד ו/או מזחלות שלג , למעט כיסוי לספורט חורף לפי ההרחבה המפורטת בפרק 14"]
      Harel:
        verdict: needs_extension
        why: Exclusion 7.18 removes winter sports unless the chapter 19 cover is bought and listed.
        evidence:
          - [harel-policy, 17, "ספורט אתגרי כהגדרתו בפרק 18 ו/או ספורט חורף כהגדרתו בפרק 19 בפוליסה (למעט אם נרכש כיסוי זה וצוין בדף הרשימה)"]
      Phoenix:
        verdict: needs_extension
        why: Exclusion 7.15 removes winter sports (defined in 1.42) unless the chapter 12 extension is bought.
        evidence:
          - [phoenix-policy, 12, "ספורט אתגרי ו/או ספורט חורף ו/או ספורט תחרותי, ככל שלא נרכשה הרחבה ו/או הרחבות מתאימות"]
          - [phoenix-policy, 8, "1.42 ספורט חורף פעילותו של המבוטח באחד או יותר מענפי הפעילות הבאים"]
      Clal:
        verdict: needs_extension
        why: General exclusion 1.6 removes winter sports; the winter-sports extension cancels it on designated pistes only.
        evidence:
          - [clal-policy, 17, "פעילות ספורטיבית הכוללת גלישה בשלג בכל דרך שהיא"]
          - [clal-policy, 30, "סעיף 1.6 לחלק 3 בפוליסה הבסיסית בעניין חריג ספורט חורף בטל ומבוטל"]
      Migdal:
        verdict: needs_extension
        why: Exclusion 12.1.6 removes winter sports unless a matching extension is bought.
        evidence:
          - [migdal-policy, 30, "ספורט אתגרי הכלול ברשימה שבאתר האינטרנט של המבטח ו/או ספורט חורף, ככל שלא נרכשה הרחבה מתאימה"]
      AIG:
        verdict: needs_extension
        why: Exclusion 6.8 removes winter sports; section 5.6 covers them only if bought and printed in the policy spec.
        evidence:
          - [aig-policy, 32, "כל פעילות ספורטיבית אתגרית ו/או פעילות ספורט חורף, כהגדרתם בפוליסה"]
          - [aig-policy, 22, "הכיסוי הביטוחי לפי פרק זה תקף רק אם נרכש על ידי המבוטח ואם צויין במפורש במפרט הפוליסה"]

  - id: ski-off-piste
    question: Off-piste skiing or snowboarding outside marked runs
    answers:
      PassportCard:
        verdict: unclear
        why: Chapter 14 defines winter sports without any piste condition; no off-piste clause was found.
        question: Does the chapter 14 winter-sports extension cover skiing off marked pistes?
        evidence:
          - [passportcard-policy, 42, "14.1 הגדרה- ספורט חורף משמעותו:"]
      Harel:
        verdict: excluded
        why: 7.18 never covers winter sports outside designated sites, hours and marked runs.
        evidence:
          - [harel-policy, 17, "ובכל מקרה לא יכוסה ספורט חורף שלא נעשה באתר המיועד לכך בשעות הפעילות המוכרזות של האתר ובמסלולים המסומנים המיועדים לכך"]
      Phoenix:
        verdict: excluded
        why: The winter-sports extension excludes off-piste (12.2.1).
        evidence:
          - [phoenix-policy, 19, "או במקרה בו המבוטח גלש מחוץ למסלולי הגלישה המוסדרים off- piste"]
      Clal:
        verdict: excluded
        why: The extension lifts the winter-sports exclusion only for designated sites, hours and runs.
        evidence:
          - [clal-policy, 30, "בגין פעילויות שנעשו באתר המיועד לכך, בשעות הפעילות שלו, במסלולים המיועדים לכך"]
      Migdal:
        verdict: excluded
        why: Winter-sports cover is limited to designated sites, hours and runs.
        evidence:
          - [migdal-policy, 23, "אשר נעשתה באתר המיועד לכך בשעות הפעילות המוכרזות של האתר ובמסלולים המיועדים לכך"]
      AIG:
        verdict: excluded
        why: Section 5.6 does not cover skiing outside authorised areas.
        evidence:
          - [aig-policy, 22, "במסגרת זו לא תכוסה החלקת שלג מחוץ לאזורים המורשים לכך"]

  - id: scuba-certified
    question: Recreational scuba dive to 18 m by a certified diver
    answers:
      PassportCard:
        verdict: needs_extension
        why: Diving is on the extreme-sports list, subject to certification; needs chapter 12.
        evidence:
          - [passportcard-extreme-sports, 1, "צלילה בכפוף להסמכה"]
          - [passportcard-policy, 61, "פעילות המבוטח בכל ענף ספורט תחרותי, מקצועי או ספורט אתגרי"]
      Harel:
        verdict: needs_extension
        why: Diving deeper than 3 m is on Harel's extreme-sports list; needs chapter 18.
        evidence:
          - [harel-extreme-sports, 1, "צלילה לעומק מעל ל-3 מטר לרבות צלילה חופשית צלילה באספקת שטח וצלילת SCUBA"]
      Phoenix:
        verdict: needs_extension
        why: Diving is in definition 1.41 only with a valid Israeli diving licence; needs chapter 11.
        evidence:
          - [phoenix-policy, 8, "צלילה לרבות צלילה לעומקים (בתנאי שהמבוטח מחזיק ברישיון צלילה ישראלי מתאים ותקף)"]
      Clal:
        verdict: needs_extension
        why: Diving with breathing equipment is an extreme sport under 1.4; needs the traveller extension.
        evidence:
          - [clal-policy, 17, "צלילה הדורשת שימוש בציוד נשימה"]
          - [clal-policy, 31, "סעיפים 1.4 ו- 1.6 לחלק 3 בפוליסה הבסיסית, בעניין חריג ספורט אתגרי"]
      Migdal:
        verdict: needs_extension
        why: Diving is on the extreme-sports annex, with a licence or a certified instructor.
        evidence:
          - [migdal-sports-extensions, 1, "צלילה (בתנאי שיש לך רישיון צלילה מקיף ותקף כחוק או שאתה צולל בליווי מדריך"]
      AIG:
        verdict: needs_extension
        why: Section 5.5 covers dives to 20 m with a licence or instructor, if bought.
        evidence:
          - [aig-policy, 21, "צלילת עומק עד עומק של 20 מטר"]
          - [aig-policy, 21, "רישיון צלילה מתאים ותקף כחוק או שהוא"]

  - id: scuba-intro
    question: Introductory dive without a certification, with an instructor
    answers:
      PassportCard:
        verdict: unclear
        why: The list says diving is covered subject to certification; an intro dive has none.
        question: Is an introductory dive with a certified instructor, without a diving certificate, covered under chapter 12?
        evidence:
          - [passportcard-extreme-sports, 1, "צלילה בכפוף להסמכה"]
      Harel:
        verdict: needs_extension
        why: Diving below 3 m needs chapter 18, and no cover applies without a licence or permit the country requires.
        evidence:
          - [harel-extreme-sports, 1, "צלילה לעומק מעל ל-3 מטר"]
          - [harel-extreme-sports, 1, "הפוליסה לא תכסה אירוע ביטוחי הנובע מהפעילות הספורטיבית אם לא היה למבוטח באותה עת רישיון ו/או היתר"]
      Phoenix:
        verdict: excluded
        why: 1.41 includes diving only with an Israeli diving licence, and 11.2.2 excludes anything outside 1.41.
        evidence:
          - [phoenix-policy, 8, "בתנאי שהמבוטח מחזיק ברישיון צלילה ישראלי מתאים ותקף"]
          - [phoenix-policy, 19, "כל פעילות אתגרית שלא כלולה בהגדרת ספורט אתגרי בסעיף 1.41 לפוליסה הבסיסית"]
      Clal:
        verdict: needs_extension
        why: Diving with breathing equipment is extreme under 1.4; no certification rule was found.
        evidence:
          - [clal-policy, 17, "צלילה הדורשת שימוש בציוד נשימה"]
      Migdal:
        verdict: needs_extension
        why: The annex accepts a dive with a certified instructor under the sport-diving law.
        evidence:
          - [migdal-sports-extensions, 1, "או שאתה צולל בליווי מדריך מוסמך בהתאם לחוק הצלילה הספורטיבית"]
      AIG:
        verdict: needs_extension
        why: Covered under 5.5 with a certified instructor; 6.9 excludes diving with neither licence nor instructor.
        evidence:
          - [aig-policy, 21, "צולל בליווי מדריך מוסמך לפי חוק הצלילה"]
          - [aig-policy, 32, "צלילה ללא רישיון או בלא ליווי של מדריך מוסמך"]

  - id: scooter-licensed
    question: Riding a rented 125 cc scooter on roads, holding a licence valid for that class
    answers:
      PassportCard:
        verdict: covered
        why: Medical cover is excluded only without the matching licence (23.19); the personal-accident extension never covers two-wheelers (21.4.1).
        evidence:
          - [passportcard-policy, 60, "אם הנוהג בכלי הרכב האמור נהג בלי רישיון נהיגה המתאים לסוג הרכב המעורב באירוע"]
          - [passportcard-policy, 55, "כל כלי תחבורה/אמצעי תחבורה דו גלגלי ממונע בין כנהג ובין כנוסע, גם אם הנוהג החזיק ברישיון נהיגה מתאים ותקף במועד התאונה"]
      Harel:
        verdict: covered
        why: 7.23 requires a valid Israeli licence for that motorcycle class, unless the country needs no special licence.
        evidence:
          - [harel-policy, 18, "רישיון נהיגה תקף בישראל המתאים לסוג האופנוע המעורב באירוע התאונתי"]
      Phoenix:
        verdict: covered
        why: The only rule found is 7.8, a licence valid in the country of the event.
        evidence:
          - [phoenix-policy, 12, "תאונת דרכים כאשר למבוטח שנהג בכלי הרכב לא היה רישיון תקף לארץ האירוע"]
      Clal:
        verdict: covered
        why: The only rule found is 1.14, a licence valid in the country of the event.
        evidence:
          - [clal-policy, 18, "תאונת דרכים כאשר למבוטח, שנהג בכלי הרכב לא היה רישיון תקף לארץ האירוע"]
      Migdal:
        verdict: covered
        why: The only rule found is 12.1.11, a licence valid in the country of the event.
        evidence:
          - [migdal-policy, 30, "תאונת דרכים כאשר למבוטח שנהג בכלי הרכב לא היה רישיון תקף לארץ האירוע"]
      AIG:
        verdict: covered
        why: 6.13 excludes two-wheelers only without the licence matching the vehicle.
        evidence:
          - [aig-policy, 32, "רכיבה בכלי רכב דו-גלגלי או תלת-גלגלי כנהג או כנוסע, אם הנוהג בכלי הרכב האמור נהג בלי רישיון"]

  - id: scooter-car-licence
    question: Riding a 125 cc scooter while holding only a car licence (B)
    answers:
      PassportCard:
        verdict: excluded
        why: 23.19 needs a licence matching the vehicle type, or an Israeli or international licence for that type.
        evidence:
          - [passportcard-policy, 60, "רכיבה בכלי רכב דו-גלגלי או תלת-גלגלי כנהג או כנוסע, אם הנוהג בכלי הרכב האמור נהג בלי רישיון נהיגה המתאים לסוג הרכב המעורב באירוע"]
      Harel:
        verdict: excluded
        why: 7.23 needs a valid Israeli licence for that motorcycle class.
        evidence:
          - [harel-policy, 18, "רישיון נהיגה תקף בישראל המתאים לסוג האופנוע המעורב באירוע התאונתי"]
      Phoenix:
        verdict: unclear
        why: 7.8 asks for a licence valid in the country; whether a car licence is valid for 125 cc there decides it.
        question: If local law lets a car licence holder ride a 125 cc scooter, is that a valid licence under 7.8?
        evidence:
          - [phoenix-policy, 12, "תאונת דרכים כאשר למבוטח שנהג בכלי הרכב לא היה רישיון תקף לארץ האירוע"]
      Clal:
        verdict: unclear
        why: 1.14 asks for a licence valid in the country of the event; depends on local law for 125 cc.
        question: If local law lets a car licence holder ride a 125 cc scooter, is that a valid licence under 1.14?
        evidence:
          - [clal-policy, 18, "תאונת דרכים כאשר למבוטח, שנהג בכלי הרכב לא היה רישיון תקף לארץ האירוע"]
      Migdal:
        verdict: unclear
        why: 12.1.11 asks for a licence valid in the country of the event; depends on local law for 125 cc.
        question: If local law lets a car licence holder ride a 125 cc scooter, is that a valid licence under 12.1.11?
        evidence:
          - [migdal-policy, 30, "תאונת דרכים כאשר למבוטח שנהג בכלי הרכב לא היה רישיון תקף לארץ האירוע"]
      AIG:
        verdict: excluded
        why: 6.13 needs the licence matching the vehicle, except where no licence is required at all.
        evidence:
          - [aig-policy, 32, "רכיבה בכלי רכב דו-גלגלי או תלת-גלגלי כנהג או כנוסע, אם הנוהג בכלי הרכב האמור נהג בלי רישיון"]
          - [aig-policy, 33, "במדינות שבהן לא נדרש רישיון נהיגה בכלי רכב זה"]

  - id: atv-quad
    question: Guided ATV (quad) ride on dirt tracks
    answers:
      PassportCard:
        verdict: needs_extension
        why: Driving any vehicle off paved roads is on the extreme-sports list.
        evidence:
          - [passportcard-extreme-sports, 1, "נסיעה בכל רכב בדרכים לא סלולות"]
      Harel:
        verdict: needs_extension
        why: ATVs on unpaved roads are on Harel's extreme-sports list (organised jeep tours excepted).
        evidence:
          - [harel-extreme-sports, 1, "נסיעה ברכב שטח ממונע או אופנוע שטח או אופני שטח או טרקטורון, בדרכים לא סלולות"]
      Phoenix:
        verdict: unclear
        why: 1.41 names off-road bikes, motocross and 4x4 dirt roads, but not ATVs.
        question: Is a guided ATV ride on dirt tracks covered under chapter 11 as off-road riding?
        evidence:
          - [phoenix-policy, 8, "רכיבת שטח באמצעות אופניים או באמצעות אופנוע או באמצעות מוטוקרוס, נסיעה בדרך עפר 4 X4"]
      Clal:
        verdict: unclear
        why: Clal's list in 1.4 does not name ATVs; it also points to a list on its website, which is not indexed.
        question: Is an ATV ride an extreme sport under 1.4, and is it covered by the traveller extension?
        evidence:
          - [clal-policy, 17, "וכל ספורט אתגרי אחר כמפורט ברשימה שבאתר"]
      Migdal:
        verdict: needs_extension
        why: Riding an ATV off-road is on the annex, subject to a licence.
        evidence:
          - [migdal-sports-extensions, 1, "רכיבה על אופנוע / טרקטורון / כלי מוטורי בשטח (כפוף לרישיון כהגדרתו בפוליסה)"]
      AIG:
        verdict: needs_extension
        why: ATVs are in section 5.5.
        evidence:
          - [aig-policy, 21, "4X4, טרקטורונים, קארטינג, סקייטבורד"]

  - id: paragliding-tandem
    question: Tandem paragliding as a passenger with a licensed pilot
    answers:
      PassportCard:
        verdict: unclear
        why: The list names parachuting (צניחה) and boat-towed parasailing, not paragliding.
        question: Is tandem paragliding covered under chapter 12, and must it be named in the schedule?
        evidence:
          - [passportcard-extreme-sports, 1, "פעילות ספורט גבהים, כולל מוטורית: צניחה"]
          - [passportcard-extreme-sports, 1, "מצנח רחיפה באמצעות סירה"]
      Harel:
        verdict: needs_extension
        why: Gliding and hovering with parachutes are on Harel's list; 7.10 lets chapter 18 cover such flights.
        evidence:
          - [harel-extreme-sports, 1, "גלישה באוויר/ריחוף/דאייה בעזרת מצנחים"]
          - [harel-policy, 17, "למעט טיסה הכלולה בהגדרת ספורט אתגרי חובבני אם נרכשה הרחבה"]
      Phoenix:
        verdict: needs_extension
        why: Air gliding and hovering are in definition 1.41.
        evidence:
          - [phoenix-policy, 8, "גלישה/רחיפה/דאייה אווירית"]
      Clal:
        verdict: needs_extension
        why: Paragliders are named in 1.4.
        evidence:
          - [clal-policy, 17, "מצנחי רחיפה וצניחה לסוגיה"]
      Migdal:
        verdict: needs_extension
        why: Paragliding is named on the annex.
        evidence:
          - [migdal-sports-extensions, 1, "רחיפה (paragliding)"]
      AIG:
        verdict: needs_extension
        why: Hovering and gliding with parachutes are in 5.5.1.3.
        evidence:
          - [aig-policy, 21, "ריחוף/ דאייה בעזרת מצנחים"]

  - id: skydiving-tandem
    question: Tandem skydive with a licensed operator
    answers:
      PassportCard:
        verdict: needs_extension
        why: Parachuting is on the heights list.
        evidence:
          - [passportcard-extreme-sports, 1, "פעילות ספורט גבהים, כולל מוטורית: צניחה"]
      Harel:
        verdict: needs_extension
        why: Tandem jumps are named on Harel's list.
        evidence:
          - [harel-extreme-sports, 1, "צניחה לסוגיה לרבות צניחה חופשית, צניחת בייס עם חליפת כנפיים וצניחת טנדם"]
      Phoenix:
        verdict: needs_extension
        why: Free fall is in definition 1.41.
        evidence:
          - [phoenix-policy, 8, "טיסה בכדור פורח, צניחה חופשית"]
      Clal:
        verdict: needs_extension
        why: Parachuting of all kinds is named in 1.4.
        evidence:
          - [clal-policy, 17, "מצנחי רחיפה וצניחה לסוגיה"]
      Migdal:
        verdict: needs_extension
        why: Parachuting and free fall with an instructor are on the annex.
        evidence:
          - [migdal-sports-extensions, 1, "צניחה, צניחה חופשית בליווי מדריך"]
      AIG:
        verdict: needs_extension
        why: Covered under 5.5.1.3 if organised by a certified operator.
        evidence:
          - [aig-policy, 21, "צניחה (בתנאי שהצניחה מאורגנת ומתבצעת"]

  - id: bungee
    question: Bungee jump
    answers:
      PassportCard:
        verdict: needs_extension
        why: Bungee is on the heights list.
        evidence:
          - [passportcard-extreme-sports, 1, "טיפוס הרים עד גובה 6,000 מטר, באנג’י, אומגה"]
      Harel:
        verdict: needs_extension
        why: Bungee is on Harel's list.
        evidence:
          - [harel-extreme-sports, 1, "בנג'י, מזחלות אלפיניות"]
      Phoenix:
        verdict: needs_extension
        why: Bungee is in definition 1.41.
        evidence:
          - [phoenix-policy, 8, "באנג'י, טיפוס קירות"]
      Clal:
        verdict: needs_extension
        why: Bungee is named in 1.4.
        evidence:
          - [clal-policy, 17, "בנג'י, סנפלינג, רפטינג מדרגה 3 ומעלה"]
